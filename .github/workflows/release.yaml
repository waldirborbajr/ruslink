name: Release
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

env:
  RUST_BACKTRACE: full

permissions:
  packages: write
  contents: write

jobs:
  release:
    name: Create release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --draft \
            --title "Release ${GITHUB_REF_NAME}" \
            --verify-tag

  build-unix:
    name: Build ${{ matrix.job.os }} (${{ matrix.job.target }})
    permissions:
      contents: write
    runs-on: ${{ matrix.job.os }}
    needs: release
    strategy:
      fail-fast: false
      matrix:
        job:
          - { os: ubuntu-latest, target: i686-unknown-linux-gnu, use-cross: true, }
          - { os: ubuntu-latest, target: i686-unknown-linux-musl,use-cross: true, }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, use-cross: true, }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: macos-latest, target: aarch64-apple-darwin }
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.job.target }}

      - name: Install cross
        if: matrix.job.use-cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.job.use-cross }}" == "true" ]]; then
            cross build --release --locked --target "${{ matrix.job.target }}"
          else
            cargo build --release --locked --target "${{ matrix.job.target }}"
          fi

      - name: Verify release binary
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.job.target }}/release/ruslink"
          test -f "$binary"
          test -x "$binary"

      - name: Strip debug information
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.job.target }}/release/ruslink"
          strip "$binary"

      - name: Archive
        shell: bash
        run: |
          set -euo pipefail
          archive="ruslink-${GITHUB_REF_NAME}-${{ matrix.job.target }}.tar.gz"
          tar czf "$archive" -C "target/${{ matrix.job.target }}/release" ruslink

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          archive="ruslink-${GITHUB_REF_NAME}-${{ matrix.job.target }}.tar.gz"
          gh release upload "${GITHUB_REF_NAME}" "$archive" --clobber

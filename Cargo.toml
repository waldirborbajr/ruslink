[package]
name = "ruslink"
version = "0.5.2"
edition = "2021"
description = "A fast, modern Rust implementation of GNU Stow with built-in Git support"
authors = ["Waldir Borba Junior <wborbajr@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/waldirborbaje/ruslink"
readme = "README.md"

keywords = ["stow", "dotfiles", "symlink", "cli", "git"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
regex = "1.11"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
human-panic = "2.0.8"
pathdiff = "0.2"
once_cell = "1.20"
walkdir = "2.5"

# Optional dependencies
colored = { version = "2.1", optional = true }

# Always included (used by logging + git)
tracing-appender = { version = "0.2", features = ["parking_lot"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"

# chrono is now always available (for logging timestamps)
chrono = { version = "0.4", features = ["clock", "serde"] }

[dev-dependencies]
tempfile = "3.10"

[features]
default = ["git", "colors"]

# Git feature no longer needs to activate chrono since it's always on
git = []
colors = ["dep:colored"]
minimal = []

[profile.release]
opt-level = 3
lto = true
strip = true
panic = "abort"